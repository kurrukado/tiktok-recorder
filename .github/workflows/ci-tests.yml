name: Automated Bug & Regression Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Tự động rà soát bug định kỳ 4 lần/ngày (0h, 6h, 12h, 18h UTC)
    - cron: '0 0,6,12,18 * * *'

concurrency:
  group: ci-bug-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || 'https://discord.com/api/webhooks/1360302046116315246/_t_vP_iT1wPfsmyK3DLKafKAJKE3XDG2nH4DF_M6oVfYpf_3S0v8smVf1915_-ayILqx' }}

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Run Linter, 104 Tests & Discord Alert
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Packages (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: 1. Kiểm tra Cú pháp & Biến chưa khai báo (Flake8 Linter)
        id: linter
        run: |
          echo "=========================================="
          echo "🔍 ĐANG QUÉT TĨNH CODE VÀ BIẾN CHƯA KHAI BÁO..."
          echo "=========================================="
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > linter_report.txt 2>&1 || true
          cat linter_report.txt
          ERR_COUNT=$(tail -n 1 linter_report.txt | tr -dc '0-9')
          if [ -n "$ERR_COUNT" ] && [ "$ERR_COUNT" -gt 0 ]; then
            echo "LINTER_FAILED=true" >> $GITHUB_ENV
            echo "::error::Phát hiện $ERR_COUNT lỗi cú pháp / undefined variables trong code!"
            exit 1
          else
            echo "LINTER_FAILED=false" >> $GITHUB_ENV
          fi

      - name: 2. Chạy Bộ Kiểm Thử Lõi (78 Audit Tests)
        id: unit_tests
        run: |
          echo "=========================================="
          echo "🧪 ĐANG CHẠY 78 BÀI TEST AUDIT & REGRESSION..."
          echo "=========================================="
          python -m unittest test_audit_suite.py -v > test_report.txt 2>&1 || true
          cat test_report.txt
          if grep -q "FAILED" test_report.txt; then
            echo "TESTS_FAILED=true" >> $GITHUB_ENV
            echo "::error::Phát hiện bài test bị thất bại!"
            exit 1
          else
            echo "TESTS_FAILED=false" >> $GITHUB_ENV
          fi

      - name: 3. Kiểm tra Smoke Test Cloud API
        if: always()
        run: |
          python -c "
          import urllib.request, json
          try:
              url = 'https://tiktok-api-i0o8.onrender.com/api/health'
              req = urllib.request.Request(url, headers={'User-Agent': 'Kuru-CI-Watcher/1.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
                  print(f'[✓] Cloud Render API Health: OK ({data.get(\"status\")})')
          except Exception as e:
              print(f'[-] Render API health warning (có thể đang sleep): {e}')
          "

      - name: 4. Gửi Báo Cáo Kết Quả về Discord
        if: always()
        run: |
          python -c "
          import os, json

          linter_failed = os.environ.get('LINTER_FAILED') == 'true'
          tests_failed = os.environ.get('TESTS_FAILED') == 'true'
          job_status = 'failure' if (linter_failed or tests_failed) else 'success'

          linter_info = '0 lỗi syntax, 0 biến chưa khai báo (Clean)'
          if os.path.exists('linter_report.txt'):
              with open('linter_report.txt', 'r', encoding='utf-8', errors='ignore') as f:
                  ltxt = f.read().strip()
                  if ltxt and ltxt != '0':
                      linter_info = ltxt

          test_info = '78/78 Tests PASSED (100% OK)'
          error_extract = ''
          if os.path.exists('test_report.txt'):
              with open('test_report.txt', 'r', encoding='utf-8', errors='ignore') as f:
                  ttxt = f.read()
                  if 'FAILED' in ttxt:
                      test_info = 'FAILED - Có bài test không vượt qua!'
                      lines = ttxt.splitlines()
                      error_extract = '\n'.join(lines[-25:])

          report = {
              'linter': linter_info[:500],
              'tests': test_info,
              'error_log': error_extract if job_status == 'failure' else ''
          }

          with open('ci_final_report.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, indent=2, ensure_ascii=False)
          "

          JOB_OUTCOME="${{ job.status }}"
          if [ "$JOB_OUTCOME" != "success" ]; then
            python ci_discord_notifier.py failure ci_final_report.json
          else
            python ci_discord_notifier.py success ci_final_report.json
          fi
