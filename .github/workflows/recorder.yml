name: TikTok 24-7 Auto Recorder

on:
  workflow_dispatch:
  schedule:
    - cron: '*/50 * * * *'

concurrency:
  group: tiktok-recorder-runner
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  actions: write

jobs:
  run-recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Cloud Credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os, json
          cfg = {}
          if os.path.exists('config.json'):
              with open('config.json', 'r', encoding='utf-8') as f:
                  cfg = json.load(f)
          if os.environ.get('GOOGLE_CLIENT_ID'):
              cfg['google_client_id'] = os.environ['GOOGLE_CLIENT_ID']
          if os.environ.get('GOOGLE_CLIENT_SECRET'):
              cfg['google_client_secret'] = os.environ['GOOGLE_CLIENT_SECRET']
          if os.environ.get('GDRIVE_REFRESH_TOKEN'):
              cfg['gdrive_refresh_token'] = os.environ['GDRIVE_REFRESH_TOKEN']
              cfg['gdrive_enabled'] = True
          if 'monitored_users' not in cfg:
              cfg['monitored_users'] = []
          with open('config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, indent=4)

          cookies = {}
          if os.path.exists('cookies.json'):
              with open('cookies.json', 'r', encoding='utf-8') as f:
                  cookies = json.load(f)
          if os.environ.get('TIKTOK_SESSION_ID'):
              cookies['sessionid_ss'] = os.environ['TIKTOK_SESSION_ID']
          with open('cookies.json', 'w', encoding='utf-8') as f:
              json.dump(cookies, f, indent=4)
          print('[✓] Cấu hình credentials hoàn tất.')
          "

      - name: Run TikTok 24-7 Recorder
        env:
          TZ: 'Asia/Ho_Chi_Minh'
          TZ_OFFSET_HOURS: '7'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u cloud_daemon.py --duration-minutes 170 --interval 20

      - name: Trigger Next Run (Continuous 24-7 Relay)
        if: always()
        timeout-minutes: 5
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name || 'main' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${WORKFLOW_TOKEN:-}" ]; then
            echo "::notice::Không có Personal Access Token (WORKFLOW_PAT/GH_PAT). Cron schedule sẽ tự động kích hoạt phiên kế tiếp sau mỗi 50 phút."
            exit 0
          fi

          API_URL="https://api.github.com/repos/${REPO}/actions/workflows/recorder.yml/dispatches"
          PAYLOAD=$(printf '{"ref":"%s"}' "$REF")

          echo "Đang chuyển tiếp sang phiên kế tiếp qua GitHub Actions API: $API_URL (branch: $REF)..."

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          http_code=$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5 \
              --retry-max-time 90 \
              --request POST \
              --header "Accept: application/vnd.github+v3+json" \
              --header "Authorization: Bearer ${WORKFLOW_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$PAYLOAD" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$API_URL"
          ) || {
            echo "::notice::Chuyển tiếp API không khả dụng, cron schedule sẽ kích hoạt phiên kế tiếp."
            exit 0
          }

          echo "GitHub API Response Code: $http_code"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "::notice::[✓] Đã kích hoạt lượt ghi hình tiếp theo thành công (HTTP $http_code)!"
          else
            echo "::notice::GitHub API trả về mã $http_code. Cron schedule (mỗi 50 phút) sẽ tự động tiếp quản phiên mới."
          fi
